# Global Tracking Configuration - Phase 1
# Cross-camera person tracking using Body ReID

global_tracking:
  # Feature flag - set to true to enable global tracking
  # Can also be controlled via ENABLE_GLOBAL_TRACKING environment variable
  enabled: true

  # Body ReID model configuration
  body_reid:
    model: "osnet_x0_25_msmt17"
    weights_path: "volumes/models/weights/osnet_x0_25_msmt17.pt"
    device: "cuda:0"
    half_precision: false

  # Matching thresholds (conservative - prefer false negatives over false merges)
  matching:
    # Similarity threshold for matching (higher = more conservative)
    threshold: 0.70

    # Only match against tracks seen within this time window (seconds)
    temporal_window_sec: 60

    # Minimum gap before a person can re-enter the same camera (seconds)
    # Prevents duplicate IDs from track fragmentation
    min_reentry_gap_sec: 10

    # Minimum detection confidence for matching
    min_quality: 0.5

    # Time window for track-end matching (Phase 3)
    removal_window_sec: 300

  # Crop quality requirements (before ReID extraction)
  crop_quality:
    # Minimum crop height in pixels
    min_height: 80

    # Minimum crop width in pixels
    min_width: 40

    # Minimum crop area (height * width)
    min_area: 3200

    # Min height/width ratio (person should be vertical)
    min_aspect_ratio: 1.5

    # Max height/width ratio (avoid extreme crops)
    max_aspect_ratio: 4.0

  # Embedding management
  embeddings:
    # Keep top-K high-quality embeddings per track
    top_k_size: 5

    # Exponential moving average factor for prototype update
    prototype_alpha: 0.2

    # Extract new embedding every N frames (reduces GPU load)
    extract_interval_frames: 10

  # Safety mechanisms
  safety:
    # Run validation checks every N seconds
    validation_interval_sec: 30

    # Archive global tracks after N minutes of inactivity
    archive_after_inactive_min: 10

    # Overlapping camera groups
    # Cameras in the same group can see the same person simultaneously
    # Only split tracks if simultaneity occurs between cameras NOT in the same group
    # Format: list of camera ID lists
    # Example: [[1, 2], [3, 4, 5]] means cameras 1&2 can overlap, cameras 3&4&5 can overlap
    overlapping_cameras: []
    # overlapping_cameras:
    #   - [1, 2]      # Room A - entrance and main area overlap
    #   - [3, 4, 5]   # Room B - three cameras with overlapping views

  # Performance tuning
  performance:
    # Batch size for ReID extraction (future optimization)
    batch_size: 16

    # Cache TTL in seconds
    cache_ttl_sec: 300
