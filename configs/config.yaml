# SmartOffice Engine Configuration
# This file contains application settings for the unified person tracking and face recognition system

# Video settings
show: false  # Display video output (disable for Docker/headless)
save_video: true  # Save annotated video output to disk
output_dir: "volumes/storage/videos"  # Directory for outputs
use_api_for_cameras: true
# Recognition settings
match_threshold: 0.42  # Face similarity threshold for matching (cosine similarity, higher = stricter)
match_margin: 0.10     # Minimum gap between best and second-best score (open-set: prevents weak matches)
person_detection_threshold: 0.3  # Person detection confidence threshold (0.0-1.0)
min_face_size: 60        # Minimum face crop px (width AND height) to attempt recognition — lower for wide-angle/factory cameras
blur_threshold: 30.0     # Minimum Laplacian variance to accept a face crop — lower for compressed CCTV video
person_detection_model: yolo26  # Detection model: 'yolo26' (NMS-free, faster) or 'yolov8'

# Feature flags
enable_global_tracking: true  # Enable cross-camera global track IDs (MCMOT ReID)
face_detection_padding: 20.0  # Padding % around detected faces for better recognition (0-100)

# Action Recognition settings (Activity tracking via Ollama + YOLO phone detector)
action_recognition:
  enabled: true
  check_interval_seconds: 8   # Per-person VLM check cadence (~1-2s inference after image resize)
  max_queue_size: 20
  async_workers: 2
  inference_timeout: 30
  action_ttl_seconds: 10      # Phone labels decay quickly; working/idle last a bit longer
  actions:
    using_phone:
      backend_type: phone_usage
      description: "Select this ONLY when a mobile phone or phone-like rectangular object is clearly visible in the person's hand AND the person appears to be looking at it, typing, scrolling, or holding it for screen use. The object must be distinct from clothing, shadows, tools, wood, pockets, or machinery. Do NOT select this only because the person has a hand near the chest, face, or pocket. Do NOT select this for dark shapes on clothes or ambiguous objects."

    phone_calling:
      backend_type: phone_calling
      description: "Select this ONLY when a phone-like rectangular object is clearly visible touching or very near the person's ear, cheek, or mouth area and the person appears to be speaking or listening. Do NOT select this only because the hand is near the face."

    chatting:
      backend_type: talking
      description: "Select this ONLY if two or more people are clearly facing each other and visibly interacting, gesturing, or speaking. Do NOT select this just because people are standing near each other."

    working:
      backend_type: working
      description: "Select this when the person is at or near a workbench, table, machine, tool, or material and appears to be doing a productive task such as examining boards, positioning parts, operating equipment, assembling, measuring, or handling work material. Prefer working over using_phone when no phone-like object is clearly visible."

    carrying:
      backend_type: carrying
      description: "Select this when the person is visibly holding, lifting, or transporting a non-phone object such as a board, box, tool, part, or material with one or both hands."

    walking:
      backend_type: walking
      description: "Select this when the person is moving through the space without carrying a visible object and without clearly interacting with a person, machine, tool, material, or phone."

    idle:
      backend_type: idle
      description: "Select this when the person is standing still, waiting, or the activity is unclear and no phone-like object is visible. Use idle instead of using_phone when no phone-like object is clearly distinguishable."
# Parallel multi-camera pipeline settings
pipeline:
  detection_interval: 2        # run YOLO every N frames (1 = every frame)
  recognition_interval: 3      # run ArcFace every N detection frames
  async_queue_size: 500        # AsyncLogger queue depth (db/redis); GCS uses 200

# Monitoring & alerting thresholds
monitoring:
  fps_alert_threshold: 1.0     # alert if any camera FPS drops below this (low: 8 cameras share GPU)
  gpu_mem_threshold: 90.0      # alert if GPU VRAM usage exceeds this %
  ram_threshold: 90.0          # alert if system RAM usage exceeds this %
