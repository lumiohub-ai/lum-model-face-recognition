# Device settings
gpu_id: 0  # Use GPU (CUDA) or switch to "cpu" if GPU is not available

# Face recognition settings
match_threshold: 0.3  # Threshold for face similarity matching (can be a list for per-camera thresholds)
partial_match_threshold: 0.15  # Threshold for partial face matches

show: False  # Show the output video with annotations (disabled for headless/Docker environments)
save_video: False  # Save the output video with annotations
record_always: False  # Always record the video
save_recognized_frame: false  # Save individual frames when faces are recognized

# Evaluation settings
eval: False  # Enable evaluation mode

# ROI settings
# Other settings
timezone: "UTC"  # Timezone for tracking times
debug: True  # Enable debug mode for detailed logging

# Production settings
multi_camera: True  # Enable multi-camera mode
production: True # Enable production mode for optimized performance

# System settings
max_track_lifetime_seconds: 30
csv_log_rotation: "2 weeks"
minimum_face_size: 150  # Minimum face size to consider for recognition
