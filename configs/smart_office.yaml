# SmartOffice Engine Configuration
# This file contains application settings for the unified person tracking and face recognition system

# Video settings
show: false  # Display video output (disable for Docker/headless)
save_video: true  # Save annotated video output to disk
output_dir: "volumes/storage/person-tracking"  # Directory for outputs

# Performance settings
target_fps: 20  # Target frames per second for processing
resize_width: 1280  # Resize frame width for processing (null = no resize)

# Recognition settings
match_threshold: 0.3  # Face similarity threshold for matching
person_detection_threshold: 0.5  # Person detection confidence threshold (0.0-1.0)

# Feature flags
enable_dashboard: false  # Enable WebRTC dashboard streaming
enable_attendance_logging: true  # Log attendance events to backend API

# System settings
max_track_lifetime_seconds: 30  # Maximum time to keep inactive tracks
debug: false  # Enable debug logging
