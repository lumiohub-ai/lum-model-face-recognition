# GPU device_ids below assume the host has >= 2 GPUs (see `nvidia-smi -L`).
# On a single-GPU host, device_ids: ['1'] fails outright — do not apply this
# override there; the base compose.yml's unpinned `count: 1` is correct as-is
# for single-GPU hosts.
services:
  ollama:
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          # Doesn't share person-tracking's onnxruntime/cuDNN session, but it's
          # still a GPU-memory consumer — leaving it unpinned would let Docker
          # place it on GPU 1 too, silently reintroducing the contention this
          # PR pins person-tracking away from. Grouped with celery-worker
          # (GPU 0) since both are lighter, intermittent load next to
          # person-tracking's continuous inference.
          devices: !override
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  person-tracking:
    restart: unless-stopped
    environment:
      SO_LOG_LEVEL: INFO
    deploy:
      resources:
        reservations:
          # Pin to a specific GPU (LSO-89) rather than the base compose.yml's
          # unpinned "any 1 GPU". On a multi-GPU host, letting Docker hand out
          # a device to person-tracking and celery-worker independently means
          # they can land on the same card with no guarantee of which — that
          # ambiguous concurrent-session condition is what's tied to
          # CUDNN_BACKEND_API_FAILED crashes under real GPU contention.
          # Compose appends device lists on merge by default; !override forces
          # this to replace the base file's `count: 1` entry instead of
          # sitting alongside it as a second, conflicting reservation.
          # Adjust the device_ids below to the target host's actual GPU
          # indices (see `nvidia-smi -L`).
          devices: !override
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  celery-worker:
    restart: unless-stopped
    environment:
      SO_LOG_LEVEL: INFO
    deploy:
      resources:
        reservations:
          # See person-tracking's device-pin comment above — same reasoning,
          # grouped onto GPU 0 with ollama since both are lighter than
          # person-tracking's continuous inference load.
          devices: !override
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
