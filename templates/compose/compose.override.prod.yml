# Production override
# Usage: docker compose -f compose.yml -f compose.override.prod.yml up -d
#
# Features:
# - Uses baked-in code (no source mounts)
# - Auto-restart on failure
# - Log file size limits
# - No interactive terminal

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  ollama:
    restart: unless-stopped

  person-tracking:
    image: humblebeeintel/person-tracking:latest
    environment:
      # Production: Buffered output for performance
      PYTHONUNBUFFERED: 0
    # Auto-restart on failure
    restart: unless-stopped
    # No interactive terminal
    tty: false
    stdin_open: false
    # Limit log file size to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
