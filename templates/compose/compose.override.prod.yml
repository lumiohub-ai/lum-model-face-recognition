# Production override - use with: docker compose -f compose.yml -f templates/compose/compose.override.prod.yml up -d
#
# Features:
# - No source mounts (uses baked-in code)
# - Auto-restart on failure
# - Production logging level
# - Resource limits

services:
  person-tracking:
    image: humblebeeintel/person-tracking:latest
    environment:
      # Production logging
      LOG_LEVEL: INFO
      # Disable debug settings
      PYTHONUNBUFFERED: 0
    # Auto-restart on failure
    restart: unless-stopped
    # No interactive terminal
    tty: false
    stdin_open: false
    # Remove development volume mounts (use baked-in code)
    volumes:
      # Only mount .env and output directories
      - ./.env:/app/face-recognition/.env:ro
      - ./configs:/app/face-recognition/configs:ro
      - ./volumes/storage/person-tracking:/app/face-recognition/volumes/storage/person-tracking
      - ./logs/person-tracking:/var/log/face-recognition
      - ./volumes/models/insightface:/home/fr-user/.insightface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
