# Development override
# Usage: docker compose -f compose.yml -f compose.override.dev.yml up -d
#
# Features:
# - Source code mounting for hot reload
# - Real-time log output (PYTHONUNBUFFERED=1)
# - No auto-restart (see errors on crash)
# - Interactive terminal for debugging

services:
  postgres:
    restart: "no"

  redis:
    restart: "no"

  ollama:
    restart: "no"

  person-tracking:
    image: humblebeeintel/person-tracking:dev
    environment:
      # Development: Enable Python unbuffered output for real-time logs
      PYTHONUNBUFFERED: 1
      # Development: Disable Python bytecode caching
      PYTHONDONTWRITEBYTECODE: 1
      # Development: Prioritize mounted source over installed package
      PYTHONPATH: /app/face-recognition/src:/app/face-recognition
    volumes:
      # Mount .env for configuration
      - ./.env:/app/face-recognition/.env:ro
      # Mount source code for hot reload
      - ./src:/app/face-recognition/src
      # Configuration (writable for dev)
      - ./configs:/app/face-recognition/configs
      # Output storage
      - ./volumes/storage/person-tracking:/app/face-recognition/volumes/storage/person-tracking
      # Logs
      - ./logs/person-tracking:/var/log/face-recognition
      # Credentials
      - ./credentials:/app/face-recognition/credentials
      # Model caches
      - ./volumes/models/insightface:/home/fr-user/.insightface
      - ./volumes/models/huggingface:/home/fr-user/.cache/huggingface
      - ./volumes/models/weights:/app/face-recognition/weights:ro
    # Don't auto-restart on crash to see errors
    restart: "no"
    # Show logs in color
    tty: true
    stdin_open: true
