<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition System - Upload</title>

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .preview-image {
            max-height: 300px;
            object-fit: contain;
        }

        .drag-area {
            border: 2px dashed #cbd5e0;
            transition: all 0.3s ease;
        }

        .drag-area.active {
            border-color: #163956;
            background-color: #ebf8ff;
        }

        .success-message {
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-800 to-gray-900 min-h-screen py-12">
    <div class="max-w-xl mx-auto px-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Face Recognition System</h1>
            <p class="text-gray-300">Upload Face Image</p>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl p-6">
            <form id="uploadForm" class="space-y-6">
                <!-- Name Input -->
                <div>
                    <label for="personName" class="block text-sm font-medium text-gray-700 mb-1">
                        <i class="fas fa-user mr-2"></i>Person's Name
                    </label>
                    <input type="text" id="personName" name="name" required
                           class="block w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <!-- File Upload Area -->
                <div class="drag-area rounded-lg p-8 text-center" id="dragArea">
                    <div class="space-y-4">
                        <i class="fas fa-cloud-upload-alt text-4xl text-blue-500"></i>
                        <div class="text-gray-600">
                            <span class="font-medium">Click to upload</span> or drag and drop
                        </div>
                        <p class="text-sm text-gray-500">Supported formats: JPG, JPEG, PNG</p>
                        <input type="file" id="fileInput" class="hidden" accept=".jpg,.jpeg,.png">
                    </div>
                </div>

                <!-- Preview Area -->
                <div id="previewArea" class="hidden text-center space-y-4">
                    <img id="imagePreview" src="#" alt="Preview" class="preview-image mx-auto rounded-lg">
                    <button type="button" id="changeImage" class="text-sm text-blue-600 hover:text-blue-800">
                        <i class="fas fa-redo mr-1"></i>Change Image
                    </button>
                </div>

                <!-- Upload Button -->
                <button type="submit" id="uploadBtn" disabled
                        class="w-full flex items-center justify-center px-6 py-3 border border-transparent rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300">
                    <i class="fas fa-upload mr-2"></i>
                    Save Image
                </button>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="hidden mt-4 p-4 rounded-lg"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const dragArea = document.getElementById('dragArea');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const imagePreview = document.getElementById('imagePreview');
        const uploadBtn = document.getElementById('uploadBtn');
        const statusMessage = document.getElementById('statusMessage');
        const changeImageBtn = document.getElementById('changeImage');

        // Handle drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dragArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dragArea.addEventListener(eventName, () => {
                dragArea.classList.add('active');
            });
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dragArea.addEventListener(eventName, () => {
                dragArea.classList.remove('active');
            });
        });

        dragArea.addEventListener('drop', handleDrop);
        dragArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFiles);
        changeImageBtn.addEventListener('click', resetImage);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles({ target: { files } });
        }

        function handleFiles(e) {
            const file = e.target.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    dragArea.classList.add('hidden');
                    previewArea.classList.remove('hidden');
                    uploadBtn.disabled = false;
                }
                reader.readAsDataURL(file);
            }
        }

        function resetImage() {
            fileInput.value = '';
            dragArea.classList.remove('hidden');
            previewArea.classList.add('hidden');
            uploadBtn.disabled = true;
            statusMessage.classList.add('hidden');
        }

        function showStatus(message, isError = false) {
            statusMessage.className = `success-message rounded-lg p-4 text-center ${
                isError ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'
            }`;
            statusMessage.innerHTML = `<i class="fas ${
                isError ? 'fa-exclamation-circle' : 'fa-check-circle'
            } mr-2"></i>${message}`;
            statusMessage.classList.remove('hidden');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('personName');

            if (!nameInput.value.trim()) {
                showStatus('Please enter a name', true);
                return;
            }

            if (!fileInput.files[0]) {
                showStatus('Please select an image', true);
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('name', nameInput.value.trim());

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Uploading...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showStatus(data.message);
                    nameInput.value = '';
                    resetImage();
                } else {
                    showStatus(data.message, true);
                }
            } catch (error) {
                showStatus('Error uploading file', true);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = '<i class="fas fa-upload mr-2"></i>Save Image';
            }
        });
    </script>
</body>
</html>
