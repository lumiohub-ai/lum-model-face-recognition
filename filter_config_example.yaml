# Enhanced Filter Configuration Example
# This file documents all available filter thresholds for the face recognition system
# Copy and modify as needed for your deployment

# ============================================================================
# SHADOW MODE (for testing without actually filtering)
# ============================================================================
shadow_mode: true  # Set to false for production filtering

# ============================================================================
# QUALITY FILTER THRESHOLDS (Stage 1)
# ============================================================================

# Frontality check - how frontal the face must be (0.0-1.0)
# Higher = more strict (only very frontal faces)
# Conservative: 0.70, Balanced: 0.65, Permissive: 0.60
min_frontality_score: 0.65

# Minimum face size in pixels (width or height)
# Increase to reject small/distant faces
# Conservative: 60, Balanced: 50, Permissive: 40
minimum_face_size: 50

# Blur detection - Laplacian variance threshold
# Higher = sharper image required
# Conservative: 120, Balanced: 100, Permissive: 80
min_laplacian_variance: 100.0

# Brightness range (0-255)
# Reject faces that are too dark or overexposed
min_brightness: 40
max_brightness: 220

# Landmark spread - detects occluded faces
# Higher = requires more visible facial features
# Conservative: 0.15, Balanced: 0.12, Permissive: 0.10
min_landmark_spread: 0.12

# ============================================================================
# RECOGNITION CONFIDENCE THRESHOLDS (Stage 2)
# ============================================================================

# Clear recognition threshold - above this = recognized
# Higher = more strict matching required
# Conservative: 0.45, Balanced: 0.40, Permissive: 0.35
recognized_threshold: 0.40

# True unknown threshold - below this = confident unknown
# Lower = only very different faces are "unknown"
# Conservative: 0.18, Balanced: 0.22, Permissive: 0.25
true_unknown_threshold: 0.22

# Maximum similarity for unknown faces to be sent
# Faces with similarity above this are filtered (too similar to known people)
# Conservative: 0.22, Balanced: 0.25, Permissive: 0.28
max_unknown_similarity: 0.25

# Minimum margin between top 2 matches
# Larger margin = more confident decision
# Conservative: 0.10, Balanced: 0.08, Permissive: 0.05
min_top2_margin: 0.08

# ============================================================================
# TEMPORAL DEDUPLICATION THRESHOLDS (Stage 3)
# ============================================================================

# Cache time-to-live in seconds (how long to remember unknown faces)
# Longer = fewer duplicates but may miss legitimate repeats
# Conservative: 600 (10min), Balanced: 300 (5min), Permissive: 180 (3min)
dedup_cache_ttl_seconds: 300

# Similarity threshold for considering duplicates (0.0-1.0)
# Higher = must be very similar to be considered duplicate
# Conservative: 0.90, Balanced: 0.85, Permissive: 0.80
dedup_similarity_threshold: 0.85

# Cross-camera deduplication window in seconds
# Window for considering same person across different cameras
# Conservative: 90, Balanced: 60, Permissive: 30
dedup_cross_camera_window: 60

# ============================================================================
# TRACK QUALITY THRESHOLDS (Stage 4)
# ============================================================================

# Minimum average quality score for the track (0.0-1.0)
# Composite score from frontality, sharpness, brightness
# Conservative: 0.70, Balanced: 0.60, Permissive: 0.50
min_track_quality_score: 0.60

# Minimum number of high-quality frames required in track
# More frames = more confident detection
# Conservative: 5, Balanced: 3, Permissive: 2
min_quality_frames: 3

# Minimum track lifetime in seconds for unrecognized faces
# Longer = filters out quick walk-bys
# Conservative: 3.5, Balanced: 2.5, Permissive: 1.5
min_unrecognized_track_lifetime: 2.5

# ============================================================================
# RATE LIMITING (Stage 5)
# ============================================================================

# Maximum unknowns per camera per minute
# Prevents flooding from one camera
# Conservative: 5, Balanced: 8, Permissive: 12
max_unknowns_per_camera_per_minute: 8

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Directory for filter decision logs
filter_log_dir: /app/logs

# ============================================================================
# PER-CAMERA THRESHOLD OVERRIDES (Optional)
# ============================================================================
# You can override thresholds for specific cameras
# Useful when cameras have different lighting/angle characteristics

camera_overrides:
  # Example: Lobby camera (well-lit, frontal view)
  "lobby_entrance":
    min_frontality_score: 0.70
    min_laplacian_variance: 120
    true_unknown_threshold: 0.20

  # Example: Hallway camera (motion blur, angled)
  "hallway_01":
    min_frontality_score: 0.60
    min_laplacian_variance: 80
    true_unknown_threshold: 0.25
    min_unrecognized_track_lifetime: 3.0

# ============================================================================
# RECOMMENDED SETTINGS BY ENVIRONMENT
# ============================================================================

# CONSERVATIVE (minimize false positives, may miss some unknowns)
# - Use in high-security areas
# - Accepts ~5-10% reduction in volume
# Settings: frontality 0.70, laplacian 120, unknown_threshold 0.18

# BALANCED (good recall, good precision)
# - Use for general office environments
# - Targets 80-90% reduction in volume
# Settings: Default values in this file

# PERMISSIVE (maximize recall, some false positives)
# - Use when you can't miss any unknown person
# - Targets 50-70% reduction in volume
# Settings: frontality 0.60, laplacian 80, unknown_threshold 0.25
