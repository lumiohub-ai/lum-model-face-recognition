# Dev override — build the person-tracking image from local source instead of
# pulling the published one. The base compose.yml pulls humblebeeai/lumiohub-model
# (prod); this lets you iterate on the model locally.
#
# Usage:  cp compose.override.dev.yml compose.override.yml   (auto-loaded by compose)
#   then: docker compose up -d --build person-tracking
#
# celery-worker reuses the person-tracking image, so only this build is needed.
services:
  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      # lum-model-vision is a private repo installed over git+ssh (see
      # requirements.txt) — forward the host's SSH agent into the build.
      # `docker compose build` picks this up automatically; a bare
      # `docker build` needs `--ssh default` for the same effect.
      ssh:
        - default
