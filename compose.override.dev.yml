# Production override for face-recognition service
# Usage: Copy this file to project root as compose.override.yml
#   cp templates/compose/compose.override.prod.yml compose.override.yml

services:
  face-recognition:
    image: face-recognition:latest
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]  # Enables GPU access for CUDA acceleration
