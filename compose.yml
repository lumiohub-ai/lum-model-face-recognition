services:
  ollama:
    image: ollama/ollama:0.18.3
    attach: false
    restart: unless-stopped
    environment:
      SO_OLLAMA_MODEL: ${SO_OLLAMA_MODEL:-gemma3:4b}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - person-tracking-network
    ports:
      - "${SO_OLLAMA_PORT:-11434}:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull ${SO_OLLAMA_MODEL:-gemma3:4b}
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  person-tracking:
    # Pulled from Docker Hub (published by CI, LSO-49). Pin the version via
    # SO_IMAGE_TAG. For local model dev, use compose.override.dev.yml to build.
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./volumes/storage/person-tracking:/app/volumes/storage/person-tracking
      - ./volumes/logs:/app/logs
      - ./credentials:/app/credentials
      # lum_vision model_cache_dir — buffalo_l, yolo26s and the ReID weights all
      # live under here now, so they survive container restarts. Runtime-
      # verified on the dev fleet: this does NOT inherit the old
      # /root/.insightface + weights layout, so first boot on a host that
      # only has the pre-extraction volumes re-downloads yolo26s.pt (~20MB)
      # and the ReID weights into this dir. Fast, but needs network — expect
      # it on first start rather than assuming the old model volume applies.
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    ports:
      # container-side must track SO_METRICS_PORT too: the app itself binds
      # to that port internally (src/config/settings.py), not a fixed 8765 —
      # a hardcoded container-side port here silently maps to nothing.
      - "${SO_METRICS_PORT:-8765}:${SO_METRICS_PORT:-8765}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python' > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  celery-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      # Same model cache as person-tracking — the embedding sync task loads the
      # face model from here rather than downloading its own copy.
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app worker -Q embeddings,detections -l warning
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── LSO-67: per-camera CPU work (tracking, identity voting) ───────────────
  # Previously started by hand during Stage 1 testing; without this service a
  # `docker compose up` cannot run the pipeline end to end when any camera is
  # listed in pipeline.celery_camera_ids.
  #
  # ipc: service:person-tracking is load-bearing, not incidental: frames cross
  # to this worker through POSIX shared memory (a 720p frame costs ~15.6ms
  # through the broker vs ~0.3ms as a handle), which requires a shared IPC
  # namespace with the producer.
  camera-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    ipc: service:person-tracking
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --pool=solo: one process, one task at a time. The threads pool collapses
    # ~330x under this app's worker_prefetch_multiplier=1 + task_acks_late
    # settings (measured, benchmarks/celery_worker/README.md); scale by adding
    # replicas of this service, not by raising concurrency.
    command: celery -A workers.celery_app worker -Q camera_frames -l warning --pool=solo
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── LSO-67 Stage 2: YOLO person detection ─────────────────────────────────
  # Owns the YOLO model; main.py no longer loads it. Kept on its own queue so
  # a camera_frames backlog can never occupy the worker that main.py's GPU
  # loop thread is blocked waiting on — see the comment in celery_app.py.
  yolo-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    ipc: service:person-tracking
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app worker -Q yolo -l warning --pool=solo
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 3G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  ollama-data:
    driver: local

networks:
  person-tracking-network:
    driver: bridge
