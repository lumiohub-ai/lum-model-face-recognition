services:
  # pgvector Database (AI Service specific - separate from Backend's PostgreSQL)
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: person-tracking-postgres
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
  #     POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./scripts/init-db:/docker-entrypoint-initdb.d
  #   ports:
  #     - "${POSTGRES_PORT:-5434}:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_recognition} -d ${POSTGRES_DB:-face_embeddings}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  # NOTE: Redis is NOT included here - uses shared Redis from main docker-compose.yml
  # AI Service connects via localhost:6379 (network_mode: host)

  ollama:
    image: ollama/ollama:latest
    container_name: person-tracking-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull gemma3:4b
        wait

  # Main Person Tracking Application (MDA Subscriber)
  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: humblebeeintel/person-tracking:dev
    container_name: person-tracking-app
    network_mode: host
    environment:
      # Application slug
      FR_SLUG: ${FR_SLUG:-face-recognition}
      PYTHONWARNINGS: "ignore::FutureWarning"

      # Client configuration
      HB_CLIENTSLUG: ${HB_CLIENTSLUG:-default_client}

      # API credentials
      SA_EMAIL: ${SA_EMAIL}
      SA_PASSWORD: ${SA_PASSWORD}
      API_HOST: ${API_HOST:-http://localhost:7091}

      # Camera configuration
      HB_IN: ${HB_IN:-}
      HB_OUT: ${HB_OUT:-}
      HB_IN_MANAGEMENT: ${HB_IN_MANAGEMENT:-}

      # Database configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face_recognition_pass}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}

      # Redis configuration (MDA)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Celery configuration (True MDA)
      CELERY_BROKER_URL: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/1

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Backend API (optional)
      SO_BACKEND_API_URL: ${SO_BACKEND_API_URL:-}

      # Ollama API for action recognition
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://localhost:11435}

      # GCS configuration
      GCS_CREDENTIALS_PATH: /app/credentials/gcs-service-account.json
      GCS_BUCKET: ${GCS_BUCKET:-hbai-general-data}

      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app/src:/app

      # SSL settings
      REQUESTS_CA_BUNDLE: ""
      CURL_CA_BUNDLE: ""

      # Logging settings
      OPENCV_FFMPEG_LOGLEVEL: "-8"
      AV_LOG_FORCE_NOCOLOR: "1"
      MPLCONFIGDIR: /tmp/matplotlib

      # GPU settings
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./configs:/app/configs
      - ./volumes/storage/person-tracking:/app/volumes/storage/person-tracking
      - ./logs/person-tracking:/var/log/face-recognition
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
      - ./volumes/models/weights:/app/weights:ro
    depends_on:
      # postgres:
      #   condition: service_healthy
      ollama:
        condition: service_started
    # NOTE: Requires external Redis from main docker-compose.yml (localhost:6379)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    tty: true
    stdin_open: true

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: humblebeeintel/person-tracking:dev
    container_name: celery-worker-embeddings
    network_mode: host
    environment:
      # Client configuration

      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/gcs-service-account.json

      GCS_CREDENTIALS_PATH: /app/credentials/gcs-service-account.json
      GCS_BUCKET: ${GCS_BUCKET:-hbai-general-data}

      HB_CLIENTSLUG: ${HB_CLIENTSLUG:-default_client}

      # Database configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face_recognition_pass}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}

      # Redis configuration (MDA)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Celery configuration
      CELERY_BROKER_URL: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/1

      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONPATH: /app/src:/app

      # SSL settings
      REQUESTS_CA_BUNDLE: ""
      CURL_CA_BUNDLE: ""

      # GPU settings
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./configs:/app/configs
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    # NOTE: Requires external Redis from main docker-compose.yml (localhost:6379)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A workers.celery_app worker -Q embeddings,detections -l info
    working_dir: /app/src
    restart: unless-stopped
    tty: true

  # Flower - Celery Monitoring Dashboard
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: humblebeeintel/person-tracking:dev
    container_name: celery-flower
    network_mode: host
    environment:
      # Celery configuration
      CELERY_BROKER_URL: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/1

      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src:/app
    volumes:
      - ./src:/app/src
    depends_on:
      - celery-worker
    # NOTE: Requires external Redis from main docker-compose.yml (localhost:6379)
    command: celery -A workers.celery_app.celery flower --port=5555
    working_dir: /app/src
    restart: unless-stopped

volumes:
  # postgres_data:
  #   driver: local
  ollama_data:
    driver: local
  model-cache:
    driver: local

networks:
  default:
    name: person-tracking-network
