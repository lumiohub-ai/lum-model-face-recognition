# Docker Compose configuration for Person Tracking System
# Usage:
#   Development: docker compose -f compose.yml -f compose.override.dev.yml up -d
#   Production:  docker compose -f compose.yml -f compose.override.prod.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: person-tracking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_recognition} -d ${POSTGRES_DB:-face_embeddings}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: person-tracking-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: person-tracking-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - OLLAMA_DEBUG=0
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llava:7b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        if ! ollama list | grep -q "$OLLAMA_MODEL"; then
          echo "Pulling $OLLAMA_MODEL model..."
          ollama pull $OLLAMA_MODEL
        fi
        wait

  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: person-tracking-app
    network_mode: host
    environment:
      # Application slug
      FR_SLUG: ${FR_SLUG:-face-recognition}

      # Client configuration
      HB_CLIENTSLUG: ${HB_CLIENTSLUG:-default_client}

      # API credentials
      SA_EMAIL: ${SA_EMAIL}
      SA_PASSWORD: ${SA_PASSWORD}
      API_HOST: ${API_HOST:-http://localhost:7091}

      # Camera configuration
      HB_IN: ${HB_IN:-}
      HB_OUT: ${HB_OUT:-}
      HB_IN_MANAGEMENT: ${HB_IN_MANAGEMENT:-}

      # Database configuration
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face_recognition_pass}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}

      # Redis configuration
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Backend API (optional)
      SO_BACKEND_API_URL: ${SO_BACKEND_API_URL:-}

      # Ollama API for action recognition
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://localhost:11435}

      # Disable SSL verification for model downloads (InsightFace)
      REQUESTS_CA_BUNDLE: ""
      CURL_CA_BUNDLE: ""

      # Suppress FFmpeg verbose logging
      OPENCV_FFMPEG_LOGLEVEL: "-8"
      AV_LOG_FORCE_NOCOLOR: "1"
      MPLCONFIGDIR: /tmp/matplotlib

      # Performance
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      # Mount .env for configuration
      - ./.env:/app/face-recognition/.env:ro
      # Configuration
      - ./configs:/app/face-recognition/configs:ro
      # Output storage
      - ./volumes/storage/person-tracking:/app/face-recognition/volumes/storage/person-tracking
      # Application logs (CSV metrics, attendance logs)
      - ./volumes/storage:/app/volumes/storage
      # Logs
      - ./logs/person-tracking:/var/log/face-recognition
      # Model cache (fr-user has write access)
      - ./volumes/models/insightface:/home/fr-user/.insightface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python.*src.main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local

networks:
  default:
    name: person-tracking-network
