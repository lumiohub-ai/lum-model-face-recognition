# Dev/test harness for this repo — NOT the production deployment.
#
# Production is so.stack's compose.yml, which today runs only person-tracking
# and celery-worker (-Q embeddings,detections). It has no camera-worker,
# yolo-worker or face-worker, and no `ipc:` sharing — so this pipeline cannot
# run there as-is. Deploying it needs those three services added with:
#   - `ipc: service:person-tracking` (frames cross by POSIX shared memory)
#   - the rpc-sockets volume on person-tracking + camera-worker (see below)
# Without both, the camera worker's RPC calls fail and every client degrades
# silently to "no detections" — the stack looks healthy and recognises nobody.
services:
  ollama:
    image: ollama/ollama:0.18.3
    attach: false
    restart: unless-stopped
    environment:
      SO_OLLAMA_MODEL: ${SO_OLLAMA_MODEL:-gemma3:4b}
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - person-tracking-network
    ports:
      - "${SO_OLLAMA_PORT:-11434}:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull ${SO_OLLAMA_MODEL:-gemma3:4b}
        wait
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  person-tracking:
    # Pulled from Docker Hub (published by CI, LSO-49). Pin the version via
    # SO_IMAGE_TAG. For local model dev, use compose.override.dev.yml to build.
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./volumes/storage/person-tracking:/app/volumes/storage/person-tracking
      - ./volumes/logs:/app/logs
      - ./credentials:/app/credentials
      # lum_vision model_cache_dir — buffalo_l, yolo26s and the ReID weights all
      # live under here now, so they survive container restarts. Runtime-
      # verified on the dev fleet: this does NOT inherit the old
      # /root/.insightface + weights layout, so first boot on a host that
      # only has the pre-extraction volumes re-downloads yolo26s.pt (~20MB)
      # and the ReID weights into this dir. Fast, but needs network — expect
      # it on first start rather than assuming the old model volume applies.
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
      # The two Unix RPC sockets this process serves to camera-worker. They
      # MUST live on a volume both containers mount: `ipc:` below shares
      # /dev/shm and the IPC namespace, not the mount namespace, so a socket
      # under /tmp is invisible to the other container — and the clients
      # degrade silently to "no detections" rather than failing loudly.
      - rpc-sockets:/run/lumiohub
    networks:
      - person-tracking-network
    ports:
      # container-side must track SO_METRICS_PORT too: the app itself binds
      # to that port internally (src/config/settings.py), not a fixed 8765 —
      # a hardcoded container-side port here silently maps to nothing.
      - "${SO_METRICS_PORT:-8765}:${SO_METRICS_PORT:-8765}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Connects to both RPC sockets rather than checking the process exists:
      # `pgrep python` goes green the instant the interpreter starts, but the
      # sockets only bind after model warm-up (engine.py's run()), so the
      # workers' `depends_on: service_healthy` was gating on nothing. connect()
      # on AF_UNIX fails with ECONNREFUSED when the file exists but nothing is
      # listening, which a file-existence test would miss.
      # python3, NOT python: the image installs python3.10 with no
      # python-is-python3, so `python` here would fail forever and nothing
      # that depends on this service would ever start.
      test: ["CMD-SHELL", "python3 -c \"import socket;[socket.socket(socket.AF_UNIX).connect(p) for p in ('/run/lumiohub/gpu-rpc.sock','/run/lumiohub/gpu-worker-rpc.sock')]\" 2>/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Covers model warm-up before the sockets bind. Too low and the whole
      # stack never comes up, since three services gate on this.
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  celery-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      # Same model cache as person-tracking — the embedding sync task loads the
      # face model from here rather than downloading its own copy.
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app worker -Q embeddings,detections -l warning
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── Per-camera CPU work: tracking and identity voting ─────────────────────
  # Every camera's per-frame work runs here; without this service the pipeline
  # does not process frames at all.
  #
  # Two mounts below are load-bearing, not incidental:
  #   ipc: service:person-tracking — frames cross to this worker through POSIX
  #     shared memory (a 720p frame costs ~15.6ms through the broker vs ~0.3ms
  #     as a handle), which needs a shared IPC namespace with the producer.
  #   rpc-sockets — this worker calls back into person-tracking for GPU
  #     inference and global track IDs over Unix sockets. `ipc:` does NOT
  #     share the mount namespace, so without this volume the sockets are
  #     unreachable and every call degrades silently to "no detections".
  camera-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    ipc: service:person-tracking
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
      - rpc-sockets:/run/lumiohub
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --pool=solo: one process, one task at a time. The threads pool collapses
    # ~330x under this app's worker_prefetch_multiplier=1 + task_acks_late
    # settings (measured, benchmarks/celery_worker/README.md).
    #
    # DO NOT scale this service beyond one replica. Sticky routing does not
    # exist yet, so a second replica would serve the same camera_id and break
    # two things silently:
    #   - GPUInferenceWorker._await_response correlates replies by a per-camera
    #     seq on a shared queue. Two waiters discard each other's replies, and
    #     its got_seq > seq early-return makes the loss permanent, not transient.
    #   - Both replicas would create RoiBatchSlot(camera_id) under the same
    #     shared-memory name; the second unlinks the first's block mid-flight.
    # Scaling safely needs per-request correlation and camera-affinity routing.
    command: celery -A workers.celery_app worker -Q camera_frames -l warning --pool=solo
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── YOLO person detection ─────────────────────────────────────────────────
  # Owns the YOLO model; main.py no longer loads it. Kept on its own queue so
  # a camera_frames backlog can never occupy the worker that main.py's GPU
  # loop thread is blocked waiting on — see the comment in celery_app.py.
  yolo-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    ipc: service:person-tracking
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Preload only this worker's own model. Without it every worker
      # loads both (worker_process_init is app-global) — see yolo_tasks.py.
      SO_WORKER_PRELOAD: yolo
    command: celery -A workers.celery_app worker -Q yolo -l warning --pool=solo
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 3G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  # ── SCRFD detection + ArcFace embedding ───────────────────────────────────
  # Owns the face models; main.py keeps only the copy EmbeddingSyncService
  # builds for its startup user sync, which is not on any per-frame path.
  #
  # Separate from yolo-worker on purpose, not just for tidiness: the two
  # models have very different shapes (SCRFD runs per-ROI, ArcFace per-crop,
  # neither batchable — versus YOLO's genuinely batched call), so a slow face
  # cycle must not hold up detection, and each can later move to its own GPU.
  face-worker:
    image: humblebeeai/lumiohub-model:${SO_IMAGE_TAG:-0.1.0}
    attach: false
    restart: unless-stopped
    depends_on:
      person-tracking:
        condition: service_healthy
    ipc: service:person-tracking
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models:/app/volumes/models
      - ./volumes/models/huggingface:/root/.cache/huggingface
    networks:
      - person-tracking-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SO_WORKER_PRELOAD: face
    command: celery -A workers.celery_app worker -Q face -l warning --pool=solo
    healthcheck:
      test: ["CMD-SHELL", "celery -A workers.celery_app inspect ping -d celery@$HOSTNAME --timeout=5 > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 3G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

volumes:
  ollama-data:
    driver: local
  # Holds the two Unix RPC sockets person-tracking serves to camera-worker.
  # A volume rather than a bind mount: socket inodes stay out of the repo tree.
  rpc-sockets:
    driver: local

networks:
  person-tracking-network:
    driver: bridge
