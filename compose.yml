services:
  ollama:
    image: ollama/ollama:latest
    container_name: lumiohub-person-tracking-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull gemma3:4b
        wait

  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
    image: humblebeeai/person-tracking-app
    container_name: lumiohub-person-tracking-app
    network_mode: host
    env_file:
      - .env
    environment:
      PYTHONWARNINGS: "ignore::FutureWarning"
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./configs:/app/configs
      - ./volumes/storage/person-tracking:/app/volumes/storage/person-tracking
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
    tty: true
    stdin_open: true

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: humblebeeai/celery-worker
    container_name: lumiohub-celery-worker
    network_mode: host
    env_file:
      - .env
    environment:
      PYTHONWARNINGS: "ignore::FutureWarning"
    volumes:
      - ./.env:/app/.env:ro
      - ./src:/app/src
      - ./configs:/app/configs
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A workers.celery_app worker -Q embeddings,detections -l info
    working_dir: /app/src
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    image: humblebeeai/celery-flower
    container_name: lumiohub-celery-flower
    network_mode: host
    environment:
      CELERY_BROKER_URL: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/1
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app/src:/app
    volumes:
      - ./src:/app/src
    depends_on:
      - celery-worker
    command: celery -A workers.celery_app.celery flower --port=5555
    working_dir: /app/src
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local