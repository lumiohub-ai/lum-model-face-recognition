services:
  ollama:
    image: ollama/ollama:latest
    container_name: lumiohub-person-tracking-ollama
    attach: false
    ports:
      - "${SO_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      SO_OLLAMA_MODEL: ${SO_OLLAMA_MODEL:-gemma3:4b}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull ${SO_OLLAMA_MODEL:-gemma3:4b}
        wait
    networks:
      - person-tracking-network

  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
    image: so.person-tracking-app
    container_name: lumiohub-person-tracking-app
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./volumes/storage/person-tracking:/app/volumes/storage/person-tracking
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
      - ./volumes/models/weights:/app/volumes/models/weights
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - person-tracking-network

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: so.celery-worker
    container_name: lumiohub-celery-worker
    attach: false
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env:ro
      - ./credentials:/app/credentials
      - ./volumes/models/insightface:/root/.insightface
      - ./volumes/models/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A workers.celery_app worker -Q embeddings,detections -l warning
    working_dir: /app/src
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - person-tracking-network

volumes:
  ollama_data:
    driver: local

networks:
  person-tracking-network:
    driver: bridge
