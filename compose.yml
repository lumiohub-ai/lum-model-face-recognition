version: '3.8'

# Docker Compose configuration for Person Tracking System
# Usage:
#   docker-compose -f docker-compose.person-tracking.yml up -d
#   docker-compose -f docker-compose.person-tracking.yml logs -f person-tracking

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: person-tracking-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-face_recognition} -d ${POSTGRES_DB:-face_embeddings}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: person-tracking-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: person-tracking-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_DEBUG=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # Reduce log verbosity
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Pull llava:13b model on startup (better vision accuracy)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull llava:7b
        wait

  person-tracking:
    build:
      context: .
      dockerfile: Dockerfile
      # Development: faster builds with caching
      args:
        - BUILDKIT_INLINE_CACHE=1
    image: humblebeeintel/person-tracking:dev
    container_name: person-tracking-app
    network_mode: host
    environment:
      # Application slug
      FR_SLUG: ${FR_SLUG:-face-recognition}

      # Client configuration
      HB_CLIENTSLUG: ${HB_CLIENTSLUG:-default_client}

      # API credentials
      SA_EMAIL: ${SA_EMAIL}
      SA_PASSWORD: ${SA_PASSWORD}
      API_HOST: ${API_HOST:-http://localhost:7091}

      # Camera configuration
      HB_IN: ${HB_IN:-}
      HB_OUT: ${HB_OUT:-}
      HB_IN_MANAGEMENT: ${HB_IN_MANAGEMENT:-}

      # Database configuration (feature flags now in configs/config.yaml)
      POSTGRES_HOST: ${POSTGRES_HOST:-localhost}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      POSTGRES_USER: ${POSTGRES_USER:-face_recognition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-face_recognition_pass}
      POSTGRES_DB: ${POSTGRES_DB:-face_embeddings}

      # Redis configuration
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Backend API (optional)
      SO_BACKEND_API_URL: ${SO_BACKEND_API_URL:-}

      # Ollama API for action recognition
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://localhost:11435}

      # Development: Enable Python unbuffered output for real-time logs
      PYTHONUNBUFFERED: 1
      # Development: Disable Python bytecode caching
      PYTHONDONTWRITEBYTECODE: 1
      # Development: Prioritize mounted source over installed package
      PYTHONPATH: /app/face-recognition/src:/app/face-recognition:${PYTHONPATH}

      # Disable SSL verification for model downloads (InsightFace)
      REQUESTS_CA_BUNDLE: ""
      CURL_CA_BUNDLE: ""

      # Suppress FFmpeg verbose logging
      OPENCV_FFMPEG_LOGLEVEL: "-8"
      AV_LOG_FORCE_NOCOLOR: "1"
      MPLCONFIGDIR: /tmp/matplotlib

      # Performance
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      # Mount .env to override baked-in .env in image
      - ./.env:/app/face-recognition/.env:ro
      # Development: Mount source code for hot reload (if supported)
      - ./src:/app/face-recognition/src
      # Configuration
      - ./configs:/app/face-recognition/configs
      # Output storage
      - ./volumes/storage/person-tracking:/app/face-recognition/volumes/storage/person-tracking
      # Logs
      - ./logs/person-tracking:/var/log/face-recognition
      # Credentials (if needed)
      - ./credentials:/app/face-recognition/credentials
      # Model cache in data directory (fr-user has write access)
      - ./volumes/models/insightface:/home/fr-user/.insightface
      # HuggingFace model cache (for Gemma-3N and other transformers models)
      - ./volumes/models/huggingface:/home/fr-user/.cache/huggingface
      - ./volumes/models/weights:/app/face-recognition/weights:ro
      # InsightFace models will be downloaded automatically on first run
      # - ./insightface_models/buffalo_l:/home/fr-user/.insightface/models/buffalo_l:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Development: don't auto-restart on crash to see errors
    restart: "no"
    # Development: Show logs in color
    tty: true
    stdin_open: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  model-cache:
    driver: local

networks:
  default:
    name: person-tracking-network
